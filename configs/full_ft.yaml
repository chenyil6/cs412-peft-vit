# Full fine-tuning: every backbone parameter + head trainable.  Upper-bound reference.
# Source: Dosovitskiy et al. (ICLR 2021) Appendix B.1.1: SGD momentum 0.9, cosine decay, no weight decay,
# gradient clipping at global norm 1, lr 0.01 (their fixed VTAB value; grid {0.001, 0.003, 0.01, 0.03}).
# Their batch size is 512; we keep the shared batch of 128.
method: full_ft
backbone: vit_b16_in21k          # timm vit_base_patch16_224.orig_in21k (checkpoint used by the VPT paper)
backbone_weights: /work/nvme/bilw/hchen56/models/vit_base_patch16_224.orig_in21k/model.safetensors
out_dir: runs

data:
  root: /work/nvme/bilw/hchen56/datasets/fgvc-aircraft-2013b-r256   # pre-resized copy (scripts/preprocess_resize.py)
  train_split: trainval
  test_split: test
  resize: 256
  crop: 224
  batch_size: 128
  eval_batch_size: 256
  workers: 8

optim:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0

sched:            # shared budget for every method (decision 2026-10-03): 100 epochs, 10 warmup, cosine to 0,
                  # the VPT paper's setting; 50 epochs left VPT-deep unconverged (65.6 -> 69.3 at 100, seed 0)
  epochs: 100
  warmup_epochs: 10
  min_lr_ratio: 0.0

train:
  seed: 0
  amp: true
  eval_every: 5
  save_ckpt: false   # 330 MB per seed; not needed for the analysis
  grad_clip: 1.0
